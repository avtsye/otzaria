<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>דף הבית</title><style>
:root{--bg:#fffaf7;--surface:#fff;--text:#27231f;--muted:#766f68;--primary:#8b5e34;--soft:#f5e9dc;--outline:#ddd2c7;--ui:system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--ui);min-height:100vh}.wrap{width:min(1080px,calc(100% - 40px));margin:auto;padding:54px 0 70px}header{text-align:center;margin-bottom:32px}.eyebrow{color:var(--primary);font-weight:700;font-size:13px}.title{font-size:38px;margin:7px 0 5px}.subtitle{color:var(--muted);margin:0}.search{display:flex;gap:10px;background:var(--surface);border:1px solid var(--outline);border-radius:18px;padding:8px;box-shadow:0 8px 28px rgba(0,0,0,.04);margin:28px auto 18px;max-width:760px}.search input{flex:1;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:17px;padding:11px 14px}button{font:inherit;color:inherit}.primary,.ghost,.book{border:0;cursor:pointer}.primary{background:var(--primary);color:white;border-radius:12px;padding:0 22px;font-weight:700}.quick{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-bottom:36px}.ghost{background:var(--soft);border-radius:999px;padding:9px 16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.panel{background:var(--surface);border:1px solid var(--outline);border-radius:20px;padding:20px;min-height:210px}.panel h2{font-size:18px;margin:0 0 14px}.list{display:grid;gap:8px}.book{text-align:right;background:transparent;border-radius:12px;padding:11px 12px;display:flex;justify-content:space-between;gap:12px;width:100%}.book:hover{background:var(--soft)}.book strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta{font-size:12px;color:var(--muted);white-space:nowrap}.empty{color:var(--muted);padding:22px 8px;text-align:center}.status{min-height:22px;color:var(--muted);text-align:center;font-size:13px;margin-top:8px}.results{max-width:760px;margin:0 auto 30px}.results[hidden]{display:none}.results .panel{min-height:0}@media(max-width:720px){.wrap{width:min(100% - 24px,1080px);padding-top:28px}.title{font-size:30px}.grid{grid-template-columns:1fr}.primary{padding:0 15px}}
</style></head><body><main class="wrap"><header><div class="eyebrow">אוצריא</div><h1 class="title">מה תרצה לפתוח?</h1><p class="subtitle">חיפוש מהיר, ספרים אחרונים וסימניות — במקום אחד.</p></header><form id="search" class="search"><input id="q" autocomplete="off" placeholder="חפש ספר בספרייה…" autofocus><button class="primary">חיפוש</button></form><div id="status" class="status"></div><section id="searchResults" class="results" hidden><div class="panel"><h2>תוצאות חיפוש</h2><div id="results" class="list"></div></div></section><div class="quick"><button id="library" class="ghost">פתיחת הספרייה</button><button id="refresh" class="ghost">רענון דף הבית</button></div><section class="grid"><div class="panel"><h2>נפתחו לאחרונה</h2><div id="recent" class="list"><div class="empty">טוען…</div></div></div><div class="panel"><h2>סימניות</h2><div id="bookmarks" class="list"><div class="empty">טוען…</div></div></div></section></main><script src="main.js"></script></body></html>
