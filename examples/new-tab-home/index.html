<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>דף הבית</title><style>
:root{--bg:#fff;--surface:#fff;--text:#202124;--muted:#70757a;--primary:#1a73e8;--soft:#f1f3f4;--outline:#dfe1e5;--ui:system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--ui);min-height:100vh}.page{width:min(980px,calc(100% - 32px));margin:auto;padding:9vh 0 60px}.brand{text-align:center;font-size:42px;font-weight:600;letter-spacing:-1px;margin-bottom:27px}.searchWrap{position:relative;max-width:720px;margin:auto}.search{display:flex;align-items:center;gap:12px;border:1px solid var(--outline);border-radius:28px;padding:0 18px;min-height:52px;background:var(--surface);box-shadow:0 1px 6px rgba(32,33,36,.12)}.search:focus-within{box-shadow:0 1px 8px rgba(32,33,36,.22)}.search input{border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:17px;flex:1;min-width:0}.searchIcon{font-size:20px;color:var(--muted)}.clear{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:20px}.dropdown{position:absolute;z-index:20;top:61px;right:0;left:0;background:var(--surface);border:1px solid var(--outline);border-radius:18px;box-shadow:0 8px 28px rgba(0,0,0,.14);max-height:62vh;overflow:auto;padding:8px}.dropdown[hidden]{display:none}.groupTitle{font-size:12px;font-weight:700;color:var(--muted);padding:9px 13px 5px}.result{width:100%;border:0;background:transparent;color:inherit;text-align:right;padding:10px 13px;border-radius:10px;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px}.result:hover,.result.active{background:var(--soft)}.result strong,.result .snippet{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.snippet{font-size:12px;color:var(--muted);margin-top:3px}.tag{font-size:11px;color:var(--muted);white-space:nowrap}.shortcuts{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:34px auto 38px;max-width:850px}.shortcut{width:88px;border:0;background:transparent;color:inherit;cursor:pointer;border-radius:14px;padding:10px 5px}.shortcut:hover{background:var(--soft)}.icon{width:48px;height:48px;border-radius:50%;background:var(--soft);display:grid;place-items:center;margin:0 auto 7px;font-size:19px}.shortcut span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}.sections{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{border:1px solid var(--outline);border-radius:18px;padding:17px;background:var(--surface)}.card h2{font-size:16px;margin:0 0 10px}.list{display:grid;gap:3px}.row{border:0;background:transparent;color:inherit;text-align:right;border-radius:10px;padding:10px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}.row:hover{background:var(--soft)}.row b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta{color:var(--muted);font-size:11px;white-space:nowrap}.empty{color:var(--muted);text-align:center;padding:18px;font-size:13px}.status{text-align:center;color:var(--muted);font-size:12px;min-height:18px;margin-top:8px}@media(max-width:700px){.page{padding-top:5vh}.brand{font-size:34px}.sections{grid-template-columns:1fr}.shortcut{width:72px}}
</style></head><body><main class="page"><div class="brand">אוצריא</div><div class="searchWrap"><div class="search"><span class="searchIcon">⌕</span><input id="q" autocomplete="off" placeholder="חיפוש בספרייה ובתוכן הספרים…"><button id="clear" class="clear" title="נקה">×</button></div><div id="dropdown" class="dropdown" hidden></div></div><div id="status" class="status"></div><div id="shortcuts" class="shortcuts"></div><section class="sections"><div class="card"><h2>המשך לקרוא</h2><div id="recent" class="list"></div></div><div class="card"><h2>סימניות אחרונות</h2><div id="bookmarks" class="list"></div></div></section></main><script src="main.js"></script></body></html>
