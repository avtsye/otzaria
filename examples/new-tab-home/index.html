<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>דף הבית</title>
<style>
body{font-family:system-ui;margin:0;padding:32px;background:#fafafa;color:#222}.wrap{max-width:900px;margin:auto}h1{font-size:32px}.search{display:flex;gap:8px;margin:24px 0}input{flex:1;padding:12px;border:1px solid #bbb;border-radius:10px}button{padding:10px 16px;border:0;border-radius:10px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.card{background:white;border:1px solid #ddd;border-radius:14px;padding:16px}#status{margin-top:12px;color:#666}
</style></head>
<body><main class="wrap"><h1>דף הבית</h1><p>כפתור + של אוצריא פותח את הדף הזה כאשר התוסף פעיל.</p>
<form id="search" class="search"><input id="q" placeholder="חפש ספר..." autocomplete="off"><button>חפש</button></form>
<div id="results" class="grid"></div><div id="status"></div></main><script src="main.js"></script></body></html>
