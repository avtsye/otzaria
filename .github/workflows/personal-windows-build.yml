name: Personal Windows Build

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/personal-windows-build.yml'

permissions:
  contents: read

concurrency:
  group: personal-windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows_x64:
    name: Build personal Windows x64 package and installer
    runs-on: windows-2025
    timeout-minutes: 110
    env:
      VC_REDIST_URL: 'https://download.visualstudio.microsoft.com/download/pr/ebdab8e5-1d7b-4d9f-a11b-cbb1720c3b12/843068991DAAA1F73AD9F6239BCE4D0F6A07A51F18C37EA2A867E9BECA71295C/VC_redist.x64.exe'
      VC_REDIST_SHA256: '843068991DAAA1F73AD9F6239BCE4D0F6A07A51F18C37EA2A867E9BECA71295C'
      VC_REDIST_MIN_VERSION: '14.51.36247.0'
    steps:
      - name: Checkout this fork
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Enable long Git paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Install Inno Setup 6.7.1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco upgrade innosetup --version 6.7.1 --allow-downgrade -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          $iscc = Get-ChildItem 'C:\Program Files*\Inno Setup 6\ISCC.exe' -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { throw 'ISCC.exe was not found after installation' }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Using $iscc"

      - name: Set up Flutter 3.47.7
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:-personal-patched-engine'

      - name: Install the verified Otzaria Flutter engine
        uses: ./.github/actions/patched-flutter-engine
        with:
          arch: x64

      - name: Fetch optional biographies data
        uses: ./.github/actions/fetch-biographies

      - name: Resolve locked dependencies
        shell: pwsh
        run: |
          flutter pub get --enforce-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate build-time settings sources
        shell: pwsh
        run: |
          dart run tool/generate_search_index.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dart run tool/generate_settings_l10n.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage verified Visual C++ runtime DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri $env:VC_REDIST_URL -OutFile installer\vc_redist.x64.exe
          $actualHash = (Get-FileHash installer\vc_redist.x64.exe -Algorithm SHA256).Hash
          if ($actualHash -ne $env:VC_REDIST_SHA256) {
            throw "VC++ Redistributable SHA-256 mismatch: $actualHash"
          }
          $proc = Start-Process -FilePath installer\vc_redist.x64.exe -ArgumentList '/install','/quiet','/norestart' -Wait -PassThru
          if ($proc.ExitCode -notin @(0, 1638, 3010)) {
            throw "VC++ Redistributable installation failed: $($proc.ExitCode)"
          }
          $msvcp = Join-Path $env:SystemRoot 'System32\msvcp140.dll'
          if (-not (Test-Path $msvcp)) { throw 'msvcp140.dll is missing after VC++ runtime setup' }
          $actualVersion = (Get-Item $msvcp).VersionInfo.FileVersionRaw
          if ($actualVersion -lt [version]$env:VC_REDIST_MIN_VERSION) {
            throw "VC++ runtime $actualVersion is older than required $env:VC_REDIST_MIN_VERSION"
          }
          $dest = 'installer\vcredist\x64'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $dlls = @('msvcp140.dll','msvcp140_1.dll','msvcp140_2.dll','msvcp140_atomic_wait.dll','msvcp140_codecvt_ids.dll','vcruntime140.dll','vcruntime140_1.dll','vcruntime140_threads.dll','concrt140.dll','vccorlib140.dll')
          foreach ($dll in $dlls) {
            $source = Join-Path $env:SystemRoot "System32\$dll"
            if (Test-Path $source) { Copy-Item $source (Join-Path $dest $dll) -Force }
          }
          Write-Host "Staged app-local VC++ runtime DLLs (System32 version $actualVersion)."

      - name: Build Otzaria for Windows x64
        shell: pwsh
        env:
          UseMultiToolTask: 'true'
          EnforceProcessCountAcrossBuilds: 'true'
          CMAKE_BUILD_PARALLEL_LEVEL: '4'
        run: |
          New-Item -ItemType Directory -Force -Path build\dart-symbols | Out-Null
          $symbols = Join-Path $PWD 'build\dart-symbols\otzaria-dart-symbols-windows-x64.debug'
          flutter build windows --release --verbose "--dart-define=OTZARIA_BUILD_COMMIT=$(git rev-parse --short=12 HEAD)" "--extra-gen-snapshot-options=--save-debugging-info=$symbols"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $release = 'build\windows\x64\runner\Release'
          $exe = Join-Path $release 'otzaria.exe'
          $engine = Join-Path $release 'flutter_windows.dll'
          if (-not (Test-Path $exe)) { throw "Build output is missing: $exe" }
          if (-not (Test-Path $engine)) { throw "Build output is missing: $engine" }
          if ((Get-Item $exe).Length -lt 1MB) { throw 'otzaria.exe is unexpectedly small' }

          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $engine).Hash.ToLowerInvariant()
          if ($actual -ne $env:PATCHED_FLUTTER_DLL_SHA256) {
            throw "The built app does not contain the verified patched Flutter engine. Expected $env:PATCHED_FLUTTER_DLL_SHA256; got $actual"
          }
          Write-Host "Verified app executable and patched Flutter engine."

      - name: Build standard Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # This is a PowerShell script, not a native executable: LASTEXITCODE may
          # contain a stale value from an earlier tool. The script throws on failure.
          & ./tool/release/fetch_assistant_art.ps1
          $artEntry = 'installer\assistant_art\assistant_art.isi'
          $artStamp = 'installer\assistant_art\.pinned-sha256'
          if (-not (Test-Path -LiteralPath $artEntry -PathType Leaf) -or
              -not (Test-Path -LiteralPath $artStamp -PathType Leaf)) {
            throw 'Pinned installer artwork was not staged correctly'
          }

          $versionLine = Select-String -Path pubspec.yaml -Pattern '^version:' | Select-Object -First 1
          $version = $versionLine.Line.Split(':', 2)[1].Trim().Split('+')[0]
          $scriptVersion = Select-String -Path installer\otzaria.iss -Pattern '^#define MyAppVersion ' | Select-Object -First 1
          if (-not $scriptVersion -or $scriptVersion.Line -notmatch [regex]::Escape('"' + $version + '"')) {
            throw "installer\otzaria.iss version does not match pubspec.yaml ($version); refusing to create a mislabeled installer."
          }

          & "$env:ISCC" installer\otzaria.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed' }
          $setup = "installer\otzaria-$version-windows.exe"
          if (-not (Test-Path $setup)) { throw "Installer output is missing: $setup" }
          if ((Get-Item $setup).Length -lt 5MB) { throw 'Installer executable is unexpectedly small' }
          Write-Host "Created $setup ($([math]::Round((Get-Item $setup).Length / 1MB, 1)) MB)."

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7.0.2
        with:
          name: otzaria-windows-x64-installer
          path: installer/otzaria-*-windows.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Package portable Windows build
        shell: pwsh
        run: |
          $release = 'build\windows\x64\runner\Release'
          $marker = Join-Path $release 'portable.marker'
          New-Item -ItemType File -Path $marker -Force | Out-Null

          $versionLine = Select-String -Path pubspec.yaml -Pattern '^version:' | Select-Object -First 1
          $version = $versionLine.Line.Split(':', 2)[1].Trim().Split('+')[0]
          $archive = "otzaria-$version-windows-x64-personal.zip"
          Compress-Archive -Path "$release\*" -DestinationPath $archive -CompressionLevel Optimal

          if (-not (Test-Path $archive)) { throw 'Portable ZIP was not created' }
          if ((Get-Item $archive).Length -lt 10MB) { throw 'Portable ZIP is unexpectedly small' }
          "ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Created $archive ($([math]::Round((Get-Item $archive).Length / 1MB, 1)) MB)."

      - name: Upload personal Windows package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: otzaria-windows-x64-personal
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload Dart debugging symbols
        if: always() && hashFiles('build/dart-symbols/otzaria-dart-symbols-windows-x64.debug') != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: otzaria-windows-x64-dart-symbols
          path: build/dart-symbols/otzaria-dart-symbols-windows-x64.debug
          if-no-files-found: warn
          retention-days: 14
